<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка — KUNA.SKYSTREAM</title>
<link rel="icon" href="img/logo.jpg">
<style>
:root{--bg:#07090d;--bg2:#0d1118;--card:#121722;--line:#252e3e;--text:#eef2f8;--muted:#8d97a8;--accent:#7cc4ff;--ok:#25d366;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:110px}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(7,9,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;height:62px}
.top img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 28%}
.top b{font-size:16px;letter-spacing:.04em}
.top b span{color:var(--accent)}
.top .sp{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#3a475e}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04111f}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.login{max-width:380px;margin:12vh auto 0;padding:32px 24px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:center}
.login img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 28%;margin:0 auto 14px}
.login h1{font-size:22px;margin-bottom:4px}
.login p{color:var(--muted);font-size:14px;margin-bottom:20px}
.login input{width:100%;margin-bottom:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}

input[type=text],input[type=number],input[type=password],input[type=tel],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}

.tabs{display:flex;gap:6px;margin:20px 0 16px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:9px 18px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.hint{color:var(--muted);font-size:14px;margin-bottom:16px}

.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ihead h3{font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihead .ord{display:flex;gap:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f>span{display:block;margin-bottom:5px}
.pricebox{position:relative}
.pricebox input{-moz-appearance:textfield;padding-right:32px}
.pricebox input::-webkit-inner-spin-button,.pricebox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pricebox small{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.pv{font-size:13px;color:var(--accent);margin-top:4px;min-height:18px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px;font-size:15px}
.switch input{appearance:none;width:46px;height:28px;border-radius:999px;background:#2a3344;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}

.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:110px;height:84px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#000}
.ph.main{border-color:var(--accent)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;left:4px;bottom:4px;font-size:11px;background:var(--accent);color:#04111f;padding:1px 6px;border-radius:6px;font-weight:700}
.ph .acts{position:absolute;top:4px;right:4px;display:flex;gap:4px}
.ph .acts button{width:26px;height:26px;border-radius:7px;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addph{width:110px;height:84px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:13px;text-align:center}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.addph input{display:none}
.empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:18px;margin-bottom:16px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,24,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:76px;padding-top:12px;padding-bottom:12px}
.status{flex:1;font-size:14px;color:var(--muted)}
.status.dirty{color:#ffc46b}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.hidden{display:none!important}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .top .sp .btn span{display:none}
  .ph,.addph{width:96px;height:74px}
}
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <form class="login" id="loginForm">
    <img src="img/logo.jpg" alt="">
    <h1>Админ-панель</h1>
    <p>KUNA.SKYSTREAM — управление каталогом</p>
    <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn primary" style="width:100%" id="loginBtn">Войти</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="appView" class="hidden">
  <header><div class="wrap top">
    <img src="img/logo.jpg" alt=""><b>KUNA<span>.SKYSTREAM</span></b>
    <div class="sp">
      <a class="btn sm" href="/" target="_blank" rel="noopener">↗ <span>Сайт</span></a>
      <button class="btn sm" id="logout">Выйти</button>
    </div>
  </div></header>

  <main class="wrap">
    <div class="tabs">
      <button data-tab="kits" class="on">Комплекты</button>
      <button data-tab="accessories">Аксессуары</button>
      <button data-tab="contacts">Контакты</button>
    </div>

    <section data-pane="kits">
      <p class="hint">Цена 0 — на сайте будет «Цена по запросу». Первое фото — главное.</p>
      <div id="kitsList"></div>
      <button class="btn" data-add="kits">+ Добавить комплект</button>
    </section>

    <section data-pane="accessories" class="hidden">
      <p class="hint">Цена 0 — на сайте будет «Цена по запросу».</p>
      <div id="accessoriesList"></div>
      <button class="btn" data-add="accessories">+ Добавить аксессуар</button>
    </section>

    <section data-pane="contacts" class="hidden">
      <div class="item">
        <label class="f"><span>Номер WhatsApp / телефон (только цифры, с 7 в начале)</span>
          <input type="tel" id="phone" inputmode="numeric" placeholder="77472920242"></label>
        <p class="hint" style="margin:10px 0 0">На этот номер приходят заказы с кнопок «Заказать».</p>
      </div>
    </section>
  </main>

  <div class="bar"><div class="wrap">
    <div class="status" id="status">Загрузка…</div>
    <button class="btn primary" id="save" disabled>Сохранить</button>
  </div></div>
</div>

<script src="catalog-default.js"></script>
<script>
{
  const $ = (s, r = document) => r.querySelector(s);
  const KEY = "kuna_admin_pw";
  let pw = "";
  try { pw = sessionStorage.getItem(KEY) || ""; } catch (e) {}
  let data = null, dirty = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => n > 0 ? Number(n).toLocaleString("ru-RU").replace(/ /g, " ") + " ₸" : "Цена по запросу";

  function setStatus(text, cls) { const s = $("#status"); s.textContent = text; s.className = "status " + (cls || ""); }
  function markDirty() { dirty = true; $("#save").disabled = false; setStatus("Есть несохранённые изменения", "dirty"); }

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: "Bearer " + pw } });
    let body = null; try { body = await r.json(); } catch (e) {}
    if (!r.ok) { const err = new Error((body && body.error) || "Ошибка " + r.status); err.status = r.status; throw err; }
    return body;
  }

  // ---------- вход ----------
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    pw = $("#pw").value; $("#loginErr").textContent = ""; $("#loginBtn").disabled = true;
    try { await api("/api/login", { method: "POST" }); try { sessionStorage.setItem(KEY, pw); } catch (e) {} start(); }
    catch (err) { $("#loginErr").textContent = err.message; }
    $("#loginBtn").disabled = false;
  });
  $("#logout").addEventListener("click", () => {
    if (dirty && !confirm("Есть несохранённые изменения. Выйти без сохранения?")) return;
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    dirty = false; location.reload();
  });

  async function start() {
    $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden");
    try {
      const r = await fetch("/api/catalog", { cache: "no-store" });
      const d = r.ok ? await r.json() : null;
      data = d && d.kits ? d : JSON.parse(JSON.stringify(SITE));
      setStatus(d && d.updatedAt ? "Сохранено " + new Date(d.updatedAt).toLocaleString("ru-RU") : "Пока используется каталог по умолчанию");
    } catch (e) { data = JSON.parse(JSON.stringify(SITE)); setStatus("Не удалось загрузить каталог", "bad"); }
    data.accessories.forEach((a) => { if (!a.photos) a.photos = a.photo ? [a.photo] : []; delete a.photo; });
    $("#phone").value = data.phone || "";
    render();
  }

  // ---------- отрисовка ----------
  function itemHtml(type, it, i, n) {
    const kit = type === "kits";
    const photos = (it.photos || []).map((p, j) => `
      <div class="ph ${j ? "" : "main"}">
        <img src="${esc(p)}" alt="">
        ${j ? "" : '<span class="tag">Главное</span>'}
        <div class="acts">
          ${j ? `<button title="Сделать главным" data-act="main" data-j="${j}">★</button>` : ""}
          <button title="Удалить фото" data-act="delph" data-j="${j}">✕</button>
        </div>
      </div>`).join("");
    return `
    <div class="item" data-type="${type}" data-i="${i}">
      <div class="ihead">
        <h3>${esc(it.name) || "Без названия"}</h3>
        <div class="ord">
          <button class="btn sm" data-act="up" ${i ? "" : "disabled"} title="Выше">↑</button>
          <button class="btn sm" data-act="down" ${i < n - 1 ? "" : "disabled"} title="Ниже">↓</button>
          <button class="btn sm danger" data-act="del" title="Удалить">Удалить</button>
        </div>
      </div>
      <div class="grid">
        <label class="f"><span>Название</span><input type="text" data-f="name" value="${esc(it.name)}" maxlength="80"></label>
        <label class="f"><span>Цена, ₸</span>
          <div class="pricebox"><input type="number" data-f="price" value="${it.price || 0}" min="0" step="1000" inputmode="numeric"><small>₸</small></div>
          <div class="pv">${fmt(it.price)}</div></label>
        <label class="switch full"><input type="checkbox" data-f="inStock" ${it.inStock ? "checked" : ""}> В наличии</label>
        <label class="f full"><span>Описание</span><textarea data-f="desc" maxlength="400" rows="2">${esc(it.desc)}</textarea></label>
        ${kit ? `<label class="f full"><span>Пункты списка (каждый с новой строки, до 6)</span><textarea data-f="points" rows="3">${esc((it.points || []).join("\n"))}</textarea></label>` : ""}
        <div class="full"><label class="f"><span>Фото</span></label>
          <div class="photos">${photos}
            <label class="addph">+ Добавить<br>фото<input type="file" accept="image/*" multiple data-act="upload"></label>
          </div></div>
      </div>
    </div>`;
  }
  function render() {
    for (const type of ["kits", "accessories"]) {
      const list = data[type];
      $("#" + type + "List").innerHTML = list.length
        ? list.map((it, i) => itemHtml(type, it, i, list.length)).join("")
        : '<div class="empty">Пока пусто</div>';
    }
  }
  const itemOf = (el) => { const c = el.closest(".item"); return c ? { type: c.dataset.type, i: +c.dataset.i, card: c } : null; };

  // ---------- редактирование ----------
  $("main").addEventListener("input", (e) => {
    const f = e.target.dataset.f; const ref = itemOf(e.target);
    if (!f || !ref) return;
    const it = data[ref.type][ref.i];
    if (f === "price") { it.price = Math.max(0, Math.round(+e.target.value || 0)); $(".pv", ref.card).textContent = fmt(it.price); }
    else if (f === "inStock") it.inStock = e.target.checked;
    else if (f === "points") it.points = e.target.value.split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 6);
    else { it[f] = e.target.value; if (f === "name") $(".ihead h3", ref.card).textContent = it.name || "Без названия"; }
    markDirty();
  });
  $("#phone").addEventListener("input", (e) => { data.phone = e.target.value.replace(/\D/g, ""); markDirty(); });

  $("main").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]"); const ref = b && itemOf(b);
    if (!ref) return;
    const list = data[ref.type], it = list[ref.i], act = b.dataset.act;
    if (act === "up" && ref.i > 0) [list[ref.i - 1], list[ref.i]] = [list[ref.i], list[ref.i - 1]];
    else if (act === "down" && ref.i < list.length - 1) [list[ref.i + 1], list[ref.i]] = [list[ref.i], list[ref.i + 1]];
    else if (act === "del") { if (!confirm("Удалить «" + (it.name || "товар") + "»?")) return; list.splice(ref.i, 1); }
    else if (act === "delph") it.photos.splice(+b.dataset.j, 1);
    else if (act === "main") { const [p] = it.photos.splice(+b.dataset.j, 1); it.photos.unshift(p); }
    else return;
    render(); markDirty();
  });

  document.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => {
    const type = b.dataset.add;
    const it = { id: Math.random().toString(36).slice(2, 10), name: "", price: 0, inStock: true, desc: "", photos: [] };
    if (type === "kits") it.points = [];
    data[type].push(it); render(); markDirty();
    const cards = document.querySelectorAll(`#${type}List .item`);
    const last = cards[cards.length - 1]; last.scrollIntoView({ behavior: "smooth", block: "center" }); $("input[data-f=name]", last).focus();
  }));

  // ---------- загрузка фото (сжатие до 1400px) ----------
  function shrink(file) {
    return new Promise((res, rej) => {
      const img = new Image(); const u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u); c.toBlob((bl) => bl ? res(bl) : rej(new Error("Не удалось обработать фото")), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Файл не похож на фото")); };
      img.src = u;
    });
  }
  $("main").addEventListener("change", async (e) => {
    if (e.target.dataset.act !== "upload") return;
    const ref = itemOf(e.target); const files = [...e.target.files]; if (!ref || !files.length) return;
    const it = data[ref.type][ref.i];
    try {
      for (let k = 0; k < files.length; k++) {
        setStatus(`Загружаю фото ${k + 1} из ${files.length}…`);
        const blob = await shrink(files[k]);
        const r = await api("/api/upload", { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob });
        it.photos.push(r.url);
      }
      render(); markDirty();
    } catch (err) { if (err.status === 401) return relogin(); setStatus(err.message, "bad"); }
  });

  // ---------- сохранение ----------
  $("#save").addEventListener("click", async () => {
    const bad = [...data.kits, ...data.accessories].find((x) => !String(x.name || "").trim());
    if (bad) { setStatus("У одного из товаров нет названия", "bad"); return; }
    $("#save").disabled = true; setStatus("Сохраняю…");
    try {
      const r = await api("/api/catalog", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      data = r.catalog; dirty = false; render();
      setStatus("Сохранено. Изменения уже на сайте", "ok");
    } catch (err) { $("#save").disabled = false; if (err.status === 401) return relogin(); setStatus(err.message, "bad"); }
  });
  function relogin() { try { sessionStorage.removeItem(KEY); } catch (e) {} alert("Сессия устарела — войдите заново. Несохранённые изменения будут потеряны."); dirty = false; location.reload(); }

  // ---------- вкладки ----------
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    document.querySelectorAll("[data-pane]").forEach((p) => p.classList.toggle("hidden", p.dataset.pane !== b.dataset.tab));
  }));
  window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  if (pw) api("/api/login", { method: "POST" }).then(start).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} });
}
</script>
</body>
</html>
